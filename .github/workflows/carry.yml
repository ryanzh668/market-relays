name: carry
# carry-desk 采集中继（只读公共接口，无密钥）。本机对 Binance/Bybit/Hyperliquid 不可达，
# 由 Actions 出口 IP 代取，产物写 data/carry/{ex}/…，本机 ~/note/套利策略/collect/sync_relay.py 拉回。
# 每源 continue-on-error，一源挂不连坐；gate 只在三源全挂时红。probe 每次都跑，HTTP 码留档。
on:
  schedule:
    - cron: '7 */4 * * *'      # 每 4h（:07 避开整点拥堵）
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = 只跑可达性探针；collect = 探针 + 前向采集；backfill = 历史回填（产物为 artifact，不进仓库）；hl_v01 = HL 全量回填 4 片并行（产物 commit 进仓库）'
        required: false
        default: 'collect'
      sources:
        description: 'backfill 的源，逗号分隔（binance,hyperliquid,bybit,okx,deribit）'
        required: false
        default: 'binance,hyperliquid'
      symbols:
        description: 'backfill 只跑这些符号（逗号分隔；空 = 全宇宙），仅 binance/okx 生效'
        required: false
        default: ''
      only:
        description: 'backfill 的表（binance: funding,pool,klines；hyperliquid: funding,klines）；空 = 全部'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  carry:
    if: (github.event.inputs.mode || 'collect') != 'backfill' && github.event.inputs.mode != 'hl_v01'
    concurrency:              # 只串行前向采集（commit 冲突）；回填走 artifact，不占这把锁
      group: carry-forward
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ github.event.inputs.mode || 'collect' }}
      CARRY_WHERE: actions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe
        id: probe
        continue-on-error: true
        run: python3 scripts/fetch_carry_probe.py

      - name: Binance
        id: binance
        if: env.MODE != 'probe' && hashFiles('scripts/fetch_carry_binance.py') != ''
        continue-on-error: true
        run: python3 scripts/fetch_carry_binance.py

      - name: Bybit
        id: bybit
        if: env.MODE != 'probe' && hashFiles('scripts/fetch_carry_bybit.py') != ''
        continue-on-error: true
        run: python3 scripts/fetch_carry_bybit.py

      - name: Hyperliquid
        id: hyperliquid
        if: env.MODE != 'probe' && hashFiles('scripts/fetch_carry_hyperliquid.py') != ''
        continue-on-error: true
        run: python3 scripts/fetch_carry_hyperliquid.py

      - name: OKX (冗余；主路线是本机直连)
        id: okx
        if: env.MODE != 'probe' && hashFiles('scripts/fetch_carry_okx.py') != ''
        continue-on-error: true
        run: python3 scripts/fetch_carry_okx.py

      - name: Deribit (冗余；主路线是本机直连)
        id: deribit
        if: env.MODE != 'probe' && hashFiles('scripts/fetch_carry_deribit.py') != ''
        continue-on-error: true
        run: python3 scripts/fetch_carry_deribit.py

      - name: Manifest
        if: env.MODE != 'probe'
        run: python3 scripts/fetch_carry_manifest.py

      - name: Commit data changes
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/carry
          if git diff --cached --quiet; then
            echo "data/carry 无变化,不提交"
          else
            git commit -m "carry: $MODE $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi

      - name: Gate
        env:
          B: ${{ steps.binance.outcome }}
          Y: ${{ steps.bybit.outcome }}
          H: ${{ steps.hyperliquid.outcome }}
        run: |
          echo "mode=$MODE binance=$B bybit=$Y hyperliquid=$H"
          if [ "$MODE" = "probe" ]; then exit 0; fi
          if [ "$B" != "success" ] && [ "$Y" != "success" ] && [ "$H" != "success" ]; then
            echo "::error::三源全挂 —— 见 data/carry/*/error.jsonl"
            exit 1
          fi
          for s in "binance:$B" "bybit:$Y" "hyperliquid:$H"; do
            [ "${s#*:}" = "success" ] || echo "::warning::${s%%:*} 未成功(${s#*:})"
          done

  backfill:
    if: github.event.inputs.mode == 'backfill'
    concurrency:
      group: carry-backfill-${{ matrix.src }}-${{ github.event.inputs.symbols }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        src: [binance, hyperliquid, bybit, okx, deribit]
    env:
      MODE: backfill
      CARRY_WHERE: actions
      ONLY: ${{ github.event.inputs.only }}
      SYMBOLS: ${{ github.event.inputs.symbols }}
    steps:
      - uses: actions/checkout@v4
        if: contains(github.event.inputs.sources, matrix.src)
      - uses: actions/setup-python@v5
        if: contains(github.event.inputs.sources, matrix.src)
        with:
          python-version: '3.11'
      - name: Backfill ${{ matrix.src }}
        if: contains(github.event.inputs.sources, matrix.src)
        continue-on-error: true
        run: python3 scripts/fetch_carry_${{ matrix.src }}.py
      - uses: actions/upload-artifact@v4
        if: contains(github.event.inputs.sources, matrix.src)
        with:
          name: carry-backfill-${{ matrix.src }}
          path: |
            backfill_out
            data/carry/${{ matrix.src }}/meta.json
          retention-days: 30

  # v0.1：Hyperliquid 全量回填（meta 全部永续），4 片并行 → 汇总 job 一次性 commit 进 data/carry/hyperliquid/
  hl_v01:
    if: github.event.inputs.mode == 'hl_v01'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      MODE: backfill
      CARRY_WHERE: actions
      CARRY_RETRIES: '8'
      ONLY: ${{ github.event.inputs.only }}
      SYMBOLS: ${{ github.event.inputs.symbols }}
      SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: HL backfill shard ${{ matrix.shard }}
        continue-on-error: true
        run: python3 scripts/fetch_carry_hyperliquid.py
      - uses: actions/upload-artifact@v4
        with:
          name: hl-v01-${{ matrix.shard }}
          path: backfill_out
          retention-days: 14

  hl_v01_commit:
    if: github.event.inputs.mode == 'hl_v01'
    needs: hl_v01
    concurrency:
      group: carry-forward
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: hl-v01-*
          path: hl_art
      - name: Merge into data/carry/hyperliquid
        run: |
          set -euo pipefail
          mkdir -p data/carry/hyperliquid
          for d in hl_art/hl-v01-*; do
            mkdir -p data/carry/hyperliquid/backfill data/carry/hyperliquid/v01
            [ -d "$d/hyperliquid/backfill" ] && cp -r "$d/hyperliquid/backfill/." data/carry/hyperliquid/backfill/ || true
            [ -d "$d/hyperliquid/v01" ] && cp -r "$d/hyperliquid/v01/." data/carry/hyperliquid/v01/ || true
            [ -f "$d/hyperliquid/error.jsonl" ] && cat "$d/hyperliquid/error.jsonl" >> data/carry/hyperliquid/v01/errors.jsonl || true
          done
          du -sh data/carry/hyperliquid
          python3 scripts/fetch_carry_manifest.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/carry
          git commit -m "carry: HL v0.1 全量回填 $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
